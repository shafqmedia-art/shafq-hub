<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>إنشاء حساب أو تسجيل الدخول | شفق</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/login.css">
<script src="shafq-app/config.js" defer></script>
<script src="shafq-app/server.js" defer></script>
<script src="assets/login.js?v=2" defer></script>
</head>
<body>
<main class="entry">
  <section class="brand" aria-label="شفق ميديا">
    <div class="brand-lockup">
      <img src="assets/logo-white.png" alt="" width="426" height="874">
      <span>شفق ميديا</span>
    </div>
    <div class="brand-line"><p>كل يوم شفق جديد لعلامتك</p></div>
  </section>
  <section class="access" aria-labelledby="title">
    <div id="access-content">
      <h1 id="title">تسجيل الدخول</h1>
      <form id="email-form">
        <p class="intro" id="email-intro">أدخل بريدك الإلكتروني لنرسل لك رمز الدخول.</p>
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" dir="ltr" autocomplete="email" required maxlength="254" aria-describedby="email-message">
        <p id="email-message" class="field-message" role="status" hidden></p>
        <button id="send-code" type="submit">إرسال رمز الدخول</button>
        <div class="account-switch"><button id="switch-mode" class="secondary" type="button">جديد في شفق؟ أنشئ حساباً</button></div>
      </form>
      <form id="code-form" hidden>
        <p id="delivery">أرسلنا رمز التحقق إلى <bdi id="delivery-address" dir="ltr"></bdi></p>
        <label for="code">رمز الدخول</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" dir="ltr" required maxlength="6" minlength="6" aria-describedby="code-message">
        <p id="code-message" class="field-message" role="status" hidden></p>
        <button id="confirm-code" type="submit">تأكيد الدخول</button>
        <div class="code-actions"><button id="edit" class="secondary" type="button">تعديل البريد</button><button id="resend" class="secondary" type="button">إعادة إرسال الرمز</button></div>
      </form>
    </div>
    <nav class="card-social" aria-label="قنوات التواصل مع شفق">
      <div class="social-item">
        <a href="https://wa.me/966563079286" target="_blank" rel="noopener" aria-label="محادثة شفق ميديا على واتساب">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor"><path d="M12 2a9.8 9.8 0 0 0-8.5 14.7L2 22l5.5-1.4A9.8 9.8 0 1 0 12 2Zm0 17.9c-1.5 0-3-.4-4.2-1.1l-.3-.2-3.1.8.8-3-.2-.3A8.1 8.1 0 1 1 12 19.9Zm4.5-6.1-1.7-.8c-.2-.1-.4-.1-.6.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.3-2.9c-.2-.2 0-.4.1-.5l.5-.6c.1-.1.2-.3.1-.5l-.8-1.9c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.4a2.6 2.6 0 0 0-.8 1.9c0 1.1.8 2.2.9 2.3.1.2 1.6 2.5 3.9 3.5.5.3.9.4 1.3.5.6.2 1.1.2 1.5.1.5-.1 1.5-.6 1.7-1.2.2-.5.2-.9.1-1l-.4-.2Z"/></svg>
        </a>
      </div>
      <div class="social-item">
        <a href="https://www.instagram.com/shafq.media" target="_blank" rel="noopener" aria-label="حساب شفق ميديا على إنستغرام">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>
        </a>
      </div>
    </nav>
  </section>
</main>
</body>
</html>
